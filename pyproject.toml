[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dchyflo"
version = "1.0.0"
description = "Hydropower and floating-PV operation with dynamic carbon accounting"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "D-CHyFLO contributors"}]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "matplotlib>=3.9,<4",
  "pvlib>=0.11,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/dchyflo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"scripts/run_all.py" = ["E402"]
"tests/test_basic_pipeline.py" = ["E402"]
