[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dchyflo"
version = "0.1.0"
description = "Mechanistic carbon-aware hydropower–floating-PV capacity design and coordinated dispatch"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "DOI-SPY"}]
keywords = ["floating photovoltaics", "hydropower", "carbon-aware dispatch", "lifecycle carbon", "cold regions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "scipy>=1.13,<2",
  "pvlib>=0.11,<1",
  "pyomo>=6.8,<7",
  "highspy>=1.8,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.urls]
Homepage = "https://github.com/DOI-SPY/D-CHyFLO"
Repository = "https://github.com/DOI-SPY/D-CHyFLO"
Issues = "https://github.com/DOI-SPY/D-CHyFLO/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dchyflo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
